<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camera Arcade AR</title>
  <style>
    :root { --ink:#06080c; --panel:rgba(9,13,20,.82); --line:rgba(255,255,255,.16); --lime:#c9ff4a; --muted:#aab4c3; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--ink); color:#f6f8fb; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif; }
    #app { position:relative; min-height:100svh; overflow:hidden; background:radial-gradient(circle at 50% 30%,#203248 0,#080b12 55%,#050609 100%); }
    #camera, #hand-canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #app.mirror #camera, #app.mirror #hand-canvas { transform:scaleX(-1); }
    #camera { opacity:0; transition:opacity .4s ease; }
    #camera.ready { opacity:1; }
    #hand-canvas { pointer-events:none; }
    #app::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(3,5,8,.62),transparent 29%,transparent 60%,rgba(3,5,8,.84)); }
    #ui { position:relative; z-index:2; min-height:100svh; padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; justify-content:space-between; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .eyebrow { color:var(--lime); font-size:10px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:4px 0 0; font-size:clamp(28px,7vw,44px); line-height:.9; letter-spacing:-.065em; }
    #camera-state { margin-top:2px; max-width:150px; padding:9px 11px; border:1px solid var(--line); background:var(--panel); border-radius:999px; font-size:11px; text-align:center; backdrop-filter:blur(14px); }
    #camera-state.live { color:var(--lime); border-color:rgba(201,255,74,.7); }
    #stage { margin:auto 0; display:flex; flex-direction:column; align-items:center; text-align:center; pointer-events:none; }
    #game-title { margin:0; font-size:clamp(28px,8vw,54px); letter-spacing:-.065em; line-height:.9; text-shadow:0 3px 28px #000; }
    #game-copy { max-width:315px; margin:10px 0 0; color:#edf2fa; font-size:14px; line-height:1.35; text-shadow:0 2px 10px #000; }
    #dice { margin-top:22px; width:118px; height:118px; padding:15px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); background:#f3f5f7; border-radius:22px; transform:rotate(-7deg); box-shadow:0 20px 48px rgba(0,0,0,.45); }
    #dice.rolling { animation:roll .55s linear infinite; }
    .pip { width:19px; height:19px; align-self:center; justify-self:center; border-radius:50%; background:#16202c; opacity:0; transform:scale(.5); transition:opacity .12s,transform .12s; }
    .pip.on { opacity:1; transform:scale(1); }
    @keyframes roll { 0%{transform:rotate(-7deg) scale(1)} 50%{transform:rotate(21deg) scale(.82)} 100%{transform:rotate(353deg) scale(1)} }
    #rps { display:none; width:min(440px,100%); margin-top:18px; }
    #rps.show { display:block; }
    #gesture { display:inline-block; min-width:210px; padding:14px 17px; border:1px solid rgba(201,255,74,.6); border-radius:14px; background:rgba(2,6,9,.73); color:var(--lime); font-size:20px; font-weight:900; letter-spacing:-.03em; }
    #result { min-height:28px; margin:10px 0 0; color:#fff; font-weight:800; text-shadow:0 2px 10px #000; }
    #bottom { width:min(570px,100%); margin:0 auto; padding:11px; border:1px solid var(--line); border-radius:19px; background:var(--panel); backdrop-filter:blur(18px); box-shadow:0 18px 56px rgba(0,0,0,.35); }
    .tabs, .actions { display:flex; gap:8px; }
    .actions { margin-top:9px; }
    button { min-height:42px; flex:1; border:1px solid var(--line); border-radius:11px; background:#202832; color:#f3f6fa; font:inherit; font-size:13px; font-weight:850; cursor:pointer; }
    button.selected, button.primary { background:var(--lime); border-color:var(--lime); color:#0b1105; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #footer-note { margin:9px 3px 0; color:var(--muted); font-size:11px; text-align:center; }
    @media (min-width:700px) { #ui { padding:24px; } #bottom { margin-bottom:4px; } }
  </style>
</head>
<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="hand-canvas"></canvas>
    <div id="ui">
      <header>
        <div><div class="eyebrow">Camera + augmented play</div><h1>Camera Arcade</h1></div>
        <div id="camera-state">Camera oprită</div>
      </header>

      <section id="stage" aria-live="polite">
        <h2 id="game-title">Zar AR</h2>
        <p id="game-copy">Pornește camera, apoi aruncă zarul peste lumea reală.</p>
        <div id="dice" aria-label="Zar virtual"></div>
        <div id="rps">
          <div id="gesture">Caut mâna ta</div>
          <p id="result">Arată piatră, hârtie sau foarfecă.</p>
        </div>
      </section>

      <section id="bottom" aria-label="Controale joc">
        <div class="tabs">
          <button class="selected" data-game="dice">🎲 Zar AR</button>
          <button data-game="rps">✋ Piatra–Hârtie–Foarfecă</button>
        </div>
        <div class="actions">
          <button id="camera-button">Pornește camera</button>
          <button id="flip-button" disabled>Schimbă camera</button>
          <button id="play-button" class="primary" disabled>Aruncă zarul</button>
        </div>
        <p id="footer-note">Merge în browser pe laptop și telefon. Camera cere localhost sau HTTPS.</p>
      </section>
    </div>
  </main>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';

    const app = document.querySelector('#app');
    const video = document.querySelector('#camera');
    const canvas = document.querySelector('#hand-canvas');
    const context = canvas.getContext('2d');
    const cameraButton = document.querySelector('#camera-button');
    const flipButton = document.querySelector('#flip-button');
    const playButton = document.querySelector('#play-button');
    const state = document.querySelector('#camera-state');
    const title = document.querySelector('#game-title');
    const copy = document.querySelector('#game-copy');
    const dice = document.querySelector('#dice');
    const rps = document.querySelector('#rps');
    const gesture = document.querySelector('#gesture');
    const result = document.querySelector('#result');
    let currentGame = 'dice';
    let landmarker;
    let cameraStarted = false;
    let facingMode = 'environment';
    let latestGesture = null;
    let lastVideoTime = -1;

    const pipPositions = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
    for (let i = 0; i < 9; i += 1) { const pip = document.createElement('span'); pip.className = 'pip'; dice.append(pip); }

    function renderDice(value) {
      [...dice.children].forEach((pip, index) => pip.classList.toggle('on', pipPositions[value].includes(index)));
    }
    renderDice(5);

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        state.textContent = 'Browser fără suport cameră';
        return;
      }
      try {
        state.textContent = 'Cer acces la cameră…';
        cameraStarted = false;
        video.srcObject?.getTracks().forEach(track => track.stop());
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        video.srcObject = stream;
        await video.play();
        cameraStarted = true;
        video.classList.add('ready');
        app.classList.toggle('mirror', facingMode === 'user');
        state.textContent = facingMode === 'environment' ? 'Camera spate e live' : 'Camera față e live';
        state.classList.add('live');
        cameraButton.textContent = 'Camera activă';
        cameraButton.disabled = true;
        flipButton.disabled = false;
        playButton.disabled = false;
        if (!landmarker) initializeHandTracking();
      } catch (error) {
        state.textContent = 'Permite camera și reîncearcă';
        console.error(error);
      }
    }

    async function initializeHandTracking() {
      try {
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
        landmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
          runningMode: 'VIDEO',
          numHands: 1
        });
        detectHand();
      } catch (error) {
        console.warn('Hand tracking indisponibil', error);
        if (currentGame === 'rps') gesture.textContent = 'Folosește butonul pentru o rundă';
      }
    }

    function extended(landmarks, tip, pip) { return landmarks[tip].y < landmarks[pip].y - .025; }
    function classify(landmarks) {
      const index = extended(landmarks, 8, 6);
      const middle = extended(landmarks, 12, 10);
      const ring = extended(landmarks, 16, 14);
      const pinky = extended(landmarks, 20, 18);
      const raised = [index, middle, ring, pinky].filter(Boolean).length;
      if (raised >= 4) return 'Hârtie';
      if (index && middle && !ring && !pinky) return 'Foarfecă';
      if (raised <= 1) return 'Piatră';
      return null;
    }

    function drawHand(landmarks) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.strokeStyle = '#c9ff4a'; context.lineWidth = 5; context.fillStyle = '#c9ff4a';
      const joins = [[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20],[5,9,13,17,0]];
      joins.forEach(chain => { context.beginPath(); chain.forEach((point, index) => { const x = landmarks[point].x * canvas.width; const y = landmarks[point].y * canvas.height; index ? context.lineTo(x,y) : context.moveTo(x,y); }); context.stroke(); });
      landmarks.forEach(point => { context.beginPath(); context.arc(point.x * canvas.width, point.y * canvas.height, 6, 0, Math.PI * 2); context.fill(); });
    }

    function detectHand() {
      if (!landmarker || !cameraStarted) return;
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const detection = landmarker.detectForVideo(video, performance.now());
        context.clearRect(0, 0, canvas.width, canvas.height);
        if (detection.landmarks?.length) {
          const hand = detection.landmarks[0];
          latestGesture = classify(hand);
          drawHand(hand);
          if (currentGame === 'rps') gesture.textContent = latestGesture || 'Arată o mână clară';
        } else if (currentGame === 'rps') {
          latestGesture = null;
          gesture.textContent = 'Caut mâna ta';
        }
      }
      requestAnimationFrame(detectHand);
    }

    function randomChoice() { return ['Piatră', 'Hârtie', 'Foarfecă'][Math.floor(Math.random() * 3)]; }
    function outcome(player, cpu) {
      if (player === cpu) return 'Egalitate';
      const win = (player === 'Piatră' && cpu === 'Foarfecă') || (player === 'Hârtie' && cpu === 'Piatră') || (player === 'Foarfecă' && cpu === 'Hârtie');
      return win ? 'Ai câștigat!' : 'Calculatorul câștigă';
    }
    function rollDice() {
      dice.classList.add('rolling');
      playButton.disabled = true;
      setTimeout(() => { renderDice(Math.floor(Math.random() * 6) + 1); dice.classList.remove('rolling'); playButton.disabled = false; }, 760);
    }
    function playRps() {
      if (!latestGesture) { result.textContent = 'Arată un gest în cameră, apoi apasă din nou.'; return; }
      const cpu = randomChoice();
      result.textContent = `Tu: ${latestGesture}. Calculator: ${cpu}. ${outcome(latestGesture, cpu)}`;
    }
    function setGame(game) {
      currentGame = game;
      document.querySelectorAll('[data-game]').forEach(button => button.classList.toggle('selected', button.dataset.game === game));
      const isDice = game === 'dice';
      title.textContent = isDice ? 'Zar AR' : 'Piatra–Hârtie–Foarfecă';
      copy.textContent = isDice ? 'Aruncă zarul peste lumea reală.' : 'Arată mâna camerei. Aplicația recunoaște piatra, hârtia și foarfeca.';
      dice.style.display = isDice ? 'grid' : 'none';
      rps.classList.toggle('show', !isDice);
      playButton.textContent = isDice ? 'Aruncă zarul' : 'Joacă runda';
      if (!isDice && !landmarker) gesture.textContent = 'Pornește camera pentru recunoaștere';
    }

    cameraButton.addEventListener('click', startCamera);
    flipButton.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });
    playButton.addEventListener('click', () => currentGame === 'dice' ? rollDice() : playRps());
    document.querySelectorAll('[data-game]').forEach(button => button.addEventListener('click', () => setGame(button.dataset.game)));
  </script>
</body>
</html>
