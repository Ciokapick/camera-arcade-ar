<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camera Arcade AR</title>
  <style>
    :root { --ink:#06080c; --panel:rgba(9,13,20,.84); --line:rgba(255,255,255,.16); --lime:#c9ff4a; --muted:#aab4c3; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { min-height:100svh; background:var(--ink); color:#f6f8fb; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
    button, input { font:inherit; }

    /* fundal: scena 3D / camera AR, sau camera pentru piatră-hârtie-foarfecă */
    #stage-root, #rps-view { position:fixed; inset:0; overflow:hidden; background:radial-gradient(circle at 50% 30%,#203248 0,#080b12 55%,#050609 100%); touch-action:none; }
    #rps-view { display:none; }
    #rps-view.show { display:block; }
    .stage-layer, #rps-video, #rps-canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .stage-video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    #rps-view.mirror #rps-video, #rps-view.mirror #rps-canvas { transform:scaleX(-1); }

    /* interfața stă deasupra; zonele goale lasă atingerile să treacă la scenă */
    #ui { position:fixed; inset:0; z-index:10; pointer-events:none; }
    .screen { position:absolute; inset:0; display:none; flex-direction:column; gap:10px; padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom)); overflow-y:auto; }
    .screen.show { display:flex; }
    #lobby, #name-screen { pointer-events:auto; background:radial-gradient(circle at 50% 20%,#203248 0,#080b12 60%,#050609 100%); }
    .panel, button, input, a, label { pointer-events:auto; }
    .panel { width:min(560px,100%); margin:0 auto; padding:14px; border:1px solid var(--line); border-radius:18px; background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
    .eyebrow { color:var(--lime); font-size:10px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:4px 0 0; font-size:clamp(28px,7vw,40px); line-height:.95; letter-spacing:-.05em; }
    h2 { margin:0 0 10px; font-size:15px; letter-spacing:-.01em; }
    p { margin:0; }
    .muted { color:var(--muted); font-size:13px; line-height:1.4; }
    .row { display:flex; gap:8px; align-items:center; }
    .row > * { flex:1; }
    button { min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:#202832; color:#f3f6fa; font-size:14px; font-weight:800; cursor:pointer; }
    button.primary, button.selected { background:var(--lime); border-color:var(--lime); color:#0b1105; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    button.small { min-height:34px; padding:0 10px; font-size:12px; flex:none; }
    input { min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:#0d131c; color:#fff; font-size:16px; min-width:0; }
    input.code { text-transform:uppercase; letter-spacing:.3em; text-align:center; font-weight:900; }

    /* nume */
    #name-screen { justify-content:center; }
    #name-screen .panel { display:flex; flex-direction:column; gap:12px; }

    /* lobby */
    .hello h1 { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    #rename { min-height:0; padding:2px 10px; border-radius:10px; font-size:inherit; font-weight:900; letter-spacing:-.05em; background:none; border:1px dashed rgba(255,255,255,.3); color:#fff; }
    #games { display:grid; gap:8px; }
    #games button { min-height:68px; text-align:left; display:flex; align-items:center; gap:12px; font-size:17px; }
    #games button span { font-size:30px; }
    #games button small { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:2px; }
    #players { display:flex; flex-wrap:wrap; gap:8px; }
    .pchip { display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.06); font-size:14px; font-weight:800; flex:none; }
    button.pchip.mine { border-color:var(--lime); }
    .pchip .x { margin-left:2px; color:var(--muted); font-weight:900; }
    #code-big { font-size:42px; font-weight:900; letter-spacing:.25em; color:var(--lime); text-align:center; margin:4px 0; }
    .dot { width:14px; height:14px; border-radius:50%; flex:none; border:2px solid rgba(255,255,255,.6); }

    /* joc */
    #game { justify-content:flex-start; }
    .top { display:flex; align-items:center; gap:8px; }
    .top h2 { margin:0; flex:1; font-size:18px; text-shadow:0 2px 10px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    button.icon { min-height:40px; padding:0 12px; flex:none; background:var(--panel); }
    .chip { padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--panel); font-size:12px; font-weight:800; flex:none; }
    #scoreboard { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
    #scoreboard .chip { display:flex; align-items:center; gap:6px; }
    #scoreboard .chip.turn { border-color:var(--lime); color:var(--lime); }
    #info { text-align:center; pointer-events:none; margin-top:6px; }
    #info-big { font-size:clamp(20px,5.5vw,30px); font-weight:900; letter-spacing:-.03em; text-shadow:0 2px 14px #000; }
    #info-small { margin-top:6px; color:#e9eef5; font-size:14px; text-shadow:0 2px 8px #000; }
    #picks { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
    #picks .chip.win { border-color:var(--lime); color:var(--lime); }
    #bottom { margin-top:auto; width:min(560px,100%); align-self:center; display:flex; flex-direction:column; gap:8px; }
    #main-action { min-height:58px; font-size:18px; border-radius:16px; }
    #pawn-buttons:empty { display:none; }
    #pawn-buttons button { min-height:52px; background:var(--panel); }
    #ar-status { text-align:center; padding:10px 12px; border-radius:12px; background:var(--panel); color:#fff; font-weight:700; }
    #ar-status:empty { display:none; }
    /* meniul „Unde stă jocul?” */
    #sheet { position:absolute; inset:0; display:flex; align-items:flex-end; background:rgba(0,0,0,.45); pointer-events:auto; padding:14px; padding-bottom:max(14px,env(safe-area-inset-bottom)); }
    #sheet .panel { display:flex; flex-direction:column; gap:8px; }
    #sheet button[data-mode] { min-height:62px; text-align:left; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; font-size:16px; }
    #sheet button small { font-size:12px; font-weight:600; color:var(--muted); margin-top:2px; }
    #sheet button.selected small { color:#24310c; }
    #toast { position:fixed; left:50%; top:max(16px,env(safe-area-inset-top)); transform:translate(-50%,-160%); z-index:30; max-width:calc(100% - 32px); padding:12px 16px; border-radius:14px; background:#2b1416; border:1px solid #ff6b6b; font-weight:800; font-size:14px; transition:transform .25s ease; pointer-events:none; }
    #toast.show { transform:translate(-50%,0); }
    [hidden] { display:none !important; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    } }
  </script>
</head>
<body>
  <div id="stage-root"></div>
  <div id="rps-view">
    <video id="rps-video" autoplay muted playsinline></video>
    <canvas id="rps-canvas"></canvas>
  </div>

  <main id="ui">
    <section id="name-screen" class="screen">
      <form class="panel" id="name-form">
        <div><div class="eyebrow">Camera Arcade AR</div><h1>Cum te cheamă?</h1></div>
        <p class="muted">Numele apare la ceilalți jucători când jucați împreună.</p>
        <input id="name-input" maxlength="20" placeholder="Numele tău" autocomplete="nickname" required>
        <button class="primary" type="submit">Intră</button>
      </form>
    </section>

    <section id="lobby" class="screen">
      <header class="panel hello">
        <div class="eyebrow">Camera Arcade AR</div>
        <h1>Salut, <button id="rename" title="Schimbă numele"><span id="hello-name"></span> ✏️</button></h1>
      </header>

      <div class="panel">
        <h2 id="games-title">Ce jucăm?</h2>
        <div id="games">
          <button data-game="barbut"><span>🎲</span><div>Barbut<small>Două zaruri, suma cea mai mare câștigă</small></div></button>
          <button data-game="rps"><span>✊</span><div>Piatră–Hârtie–Foarfecă<small>Arăți gestul cu mâna, în fața camerei</small></div></button>
          <button data-game="ludo"><span>🎯</span><div>Nu te supăra, frate<small>2–4 jucători, tabla pe masă</small></div></button>
          <button data-game="jenga"><span>🧱</span><div>Jenga<small>Tragi o piesă din turn — cine îl dărâmă pierde</small></div></button>
          <button data-game="xo"><span>❌</span><div>X și 0 3D<small>Cub 4×4×4: patru în linie, pe orice direcție</small></div></button>
        </div>
        <p class="muted" id="games-hint" style="margin-top:8px"></p>
      </div>

      <div class="panel">
        <h2>Jucători</h2>
        <div id="players"></div>
        <p class="muted" style="margin-top:8px">Atinge-ți numele ca să-ți schimbi culoarea.</p>
      </div>

      <div class="panel" id="room-panel">
        <div id="room-local">
          <h2>Cu prietenii, pe telefoanele lor</h2>
          <div class="row">
            <button class="primary" id="create-room">Creează cameră</button>
            <button id="show-join">Am un cod</button>
          </div>
          <form class="row" id="join-form" style="margin-top:8px" hidden>
            <input id="join-code" class="code" maxlength="4" placeholder="COD" autocomplete="off" autocapitalize="characters">
            <button class="primary" type="submit">Intră</button>
          </form>
        </div>
        <div id="room-online" hidden>
          <h2>Codul camerei</h2>
          <div id="code-big"></div>
          <p class="muted" id="room-hint"></p>
          <div class="row" style="margin-top:10px"><button id="leave-room">Ieși din cameră</button></div>
        </div>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="top">
        <button class="icon" id="back" aria-label="Înapoi la meniu">←</button>
        <h2 id="game-title"></h2>
        <span class="chip" id="game-code" hidden></span>
        <button class="icon" id="view-button">📱 Ecran ▾</button>
        <button class="icon" id="flip-camera" hidden aria-label="Schimbă camera">🔄</button>
      </div>
      <div id="scoreboard"></div>
      <div id="info">
        <div id="info-big"></div>
        <div id="info-small"></div>
        <div id="picks"></div>
      </div>
      <div id="bottom">
        <p id="ar-status"></p>
        <div class="row" id="pawn-buttons"></div>
        <button class="primary" id="main-action" hidden></button>
        <button id="rps-bot" hidden>Joacă contra calculatorului</button>
      </div>

      <div id="sheet" hidden>
        <div class="panel">
          <h2>Unde stă jocul?</h2>
          <button data-mode="screen">📱 Pe ecran<small>Vedere 3D, fără cameră</small></button>
          <button data-mode="table">🪑 Pe masa mea<small>Camera caută masa, apoi atingi unde pui jocul</small></button>
          <button data-mode="marker">🎯 Pe markerul comun<small>Cei din aceeași cameră văd tabla în același loc</small></button>
          <div class="row">
            <button id="replace-table" hidden>↻ Mută pe masă</button>
            <a class="muted" href="marker.html" target="_blank" style="color:var(--lime);flex:none;align-self:center">Markerul de printat</a>
          </div>
          <button id="sheet-close">Închide</button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
